name: Deploy Rosenkranz forms Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy staging Worker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$RESEND_API_KEY" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and RESEND_API_KEY to GitHub Actions secrets.'
            exit 1
          fi
          npx --yes wrangler@4 deploy --config workers/forms/wrangler.toml --env staging
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY --config workers/forms/wrangler.toml --env staging
