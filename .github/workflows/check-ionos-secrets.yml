name: Verify IONOS SFTP secrets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-ionos-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check secret availability
    runs-on: ubuntu-latest
    env:
      IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
      IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
      IONOS_DEV_SFTP_USERNAME: ${{ secrets.IONOS_DEV_SFTP_USERNAME }}
      IONOS_DEV_SFTP_PASSWORD: ${{ secrets.IONOS_DEV_SFTP_PASSWORD }}
      IONOS_DEV_REMOTE_PATH: ${{ secrets.IONOS_DEV_REMOTE_PATH }}
      IONOS_PROD_SFTP_USERNAME: ${{ secrets.IONOS_PROD_SFTP_USERNAME }}
      IONOS_PROD_SFTP_PASSWORD: ${{ secrets.IONOS_PROD_SFTP_PASSWORD }}
      IONOS_PROD_REMOTE_PATH: ${{ secrets.IONOS_PROD_REMOTE_PATH }}
    steps:
      - name: Check required secret names without printing values
        shell: bash
        run: |
          missing=0
          check_secret() {
            local name="$1"
            local value="${!name}"
            if [[ -n "$value" ]]; then
              echo "Present: $name"
            else
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          }
          check_secret IONOS_SFTP_HOST
          check_secret IONOS_SFTP_PORT
          check_secret IONOS_DEV_SFTP_USERNAME
          check_secret IONOS_DEV_SFTP_PASSWORD
          check_secret IONOS_DEV_REMOTE_PATH
          check_secret IONOS_PROD_SFTP_USERNAME
          check_secret IONOS_PROD_SFTP_PASSWORD
          check_secret IONOS_PROD_REMOTE_PATH
          exit "$missing"
