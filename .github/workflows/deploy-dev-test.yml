name: Deploy Rosenkranz DEV_TEST
run-name: DEV_TEST ${{ inputs.mode }} ${{ inputs.source_sha || github.sha }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: SFTP prüfen oder Website hochladen
        type: choice
        options: [check, upload, restamp, hardening, webcheck, formscheck]
        default: check
      source_sha:
        description: Optionaler vollständiger Commit für automatisch freigegebene API-Daten
        required: false
        type: string
      data_only:
        description: Nur generierte Fahrzeug- und Bewertungsdaten zulassen
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rosenkranz-dev-test
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'check' || inputs.mode == 'upload' || inputs.mode == 'restamp' || inputs.mode == 'hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify selected commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ -n "$SOURCE_SHA" ]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          fi
      - run: python -m pip install 'paramiko>=3.5,<5'
      - run: python -m unittest discover -s tests -p 'test_htaccess_hardening.py'
      - name: Verify destination or upload website
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DATA_ONLY: ${{ inputs.data_only }}
          SFTP_HOST: home273863182.1and1-data.host
          SFTP_PORT: "22"
          SFTP_KNOWN_HOSTS: ${{ vars.IONOS_SFTP_KNOWN_HOSTS || secrets.IONOS_SFTP_KNOWN_HOSTS }}
          SFTP_USER: u52165621
          SFTP_PASSWORD: ${{ secrets.IONOS_DEV_SFTP_PASSWORD }}
        run: |
          python - <<'PY'
          import errno
          import os
          import stat
          import tempfile
          import urllib.error
          import urllib.request
          from pathlib import Path

          import paramiko
          from scripts.htaccess_hardening import merge
          from scripts.release_files import auto_data_file, file_delta, manifest_bytes, public_files, release_manifest, selected_manifest, verify_remote_files
          import json
          import subprocess

          target = "/Web-Relaunch-2026/DEV_TEST"
          files = public_files(Path("."), include_maintenance=True)
          release_sha = os.environ["SOURCE_SHA"] or os.environ["GITHUB_SHA"]
          manifest = release_manifest(Path("."), files, release_sha)
          print(f"Target: {target}. Website files: {len(files)}", flush=True)

          for variable in ("SFTP_HOST", "SFTP_KNOWN_HOSTS", "SFTP_USER", "SFTP_PASSWORD"):
              if not os.environ[variable].strip():
                  raise SystemExit(f"Missing configuration: {variable}")

          with tempfile.NamedTemporaryFile(mode="w") as known_hosts, paramiko.SSHClient() as ssh:
              known_hosts.write(os.environ["SFTP_KNOWN_HOSTS"].rstrip() + "\n")
              known_hosts.flush()
              ssh.load_host_keys(known_hosts.name)
              ssh.set_missing_host_key_policy(paramiko.RejectPolicy())
              ssh.connect(
                  os.environ["SFTP_HOST"], port=int(os.environ["SFTP_PORT"]),
                  username=os.environ["SFTP_USER"], password=os.environ["SFTP_PASSWORD"],
                  allow_agent=False, look_for_keys=False,
                  timeout=15, banner_timeout=15, auth_timeout=15,
              )
              with ssh.open_sftp() as sftp:
                  sftp.get_channel().settimeout(30)
                  relative_target = target.lstrip("/")
                  try:
                      sftp.chdir(relative_target)
                  except FileNotFoundError:
                      root_entries = sftp.listdir(".")
                      visible = "Web-Relaunch-2026" in root_entries
                      raise SystemExit(
                          f"DEV_TEST is not reachable from SFTP login directory. "
                          f"Web-Relaunch-2026 visible at login: {visible}."
                      ) from None
                  if sftp.getcwd() != target:
                      raise SystemExit("SFTP resolved DEV_TEST to an unexpected directory.")
                  print(f"Connected. DEV_TEST entries: {len(sftp.listdir('.'))}", flush=True)
                  if os.environ["MODE"] == "check":
                      raise SystemExit(0)
                  if os.environ["MODE"] not in {"upload", "restamp", "hardening"}:
                      raise SystemExit("Unknown deployment mode.")

                  prior = None
                  if os.environ["MODE"] in {"upload", "restamp"}:
                      try:
                          with sftp.open(".rosenkranz-release.json", "rb") as entry:
                              prior = json.load(entry)
                      except FileNotFoundError:
                          if os.environ["MODE"] == "restamp" or "index.html" in sftp.listdir("."):
                              raise SystemExit("Existing DEV_TEST release marker missing; refusing incremental deployment.")

                  if os.environ["MODE"] == "restamp":
                      if prior.get("files") != manifest["files"] or prior.get("contentDigest") != manifest["contentDigest"]:
                          raise SystemExit("Public files changed; use upload instead of restamp.")
                      verify_remote_files(sftp, selected_manifest(manifest, ["index.html", "forms-config.json"]))
                      print("Unchanged DEV_TEST release marker and critical files verified.")

                  if os.environ["MODE"] == "upload":
                      changed, removed = file_delta(prior, manifest)
                      if os.environ["DATA_ONLY"] == "true":
                          if not prior or not all(auto_data_file(name) for name in changed + removed):
                              raise SystemExit("Automatic data deployment contains non-data files; manual approval required.")
                          if subprocess.run(["git", "merge-base", "--is-ancestor", prior.get("sourceCommit", ""), release_sha], check=False).returncode:
                              raise SystemExit("Automatic data deployment would move DEV_TEST backwards.")
                          source_changes = subprocess.check_output(
                              ["git", "diff", "--name-only", prior["sourceCommit"], release_sha], text=True
                          ).splitlines()
                          if not all(auto_data_file(name) for name in source_changes):
                              raise SystemExit("Automatic data deployment includes unapproved source changes.")
                      print(f"DEV_TEST delta: {len(changed)} changed, {len(removed)} removed, {len(files) - len(changed)} unchanged.", flush=True)
                      directories = sorted({parent.as_posix() for name in changed for parent in Path(name).parents} - {"."}, key=lambda name: (name.count("/"), name))
                      for directory in directories:
                          remote = directory
                          try:
                              attributes = sftp.lstat(remote)
                          except OSError as error:
                              if error.errno != errno.ENOENT:
                                  raise
                              sftp.mkdir(remote)
                              attributes = sftp.lstat(remote)
                          if not stat.S_ISDIR(attributes.st_mode):
                              raise SystemExit(f"Expected directory: {directory}")

                      for remote in changed:
                          path = Path(remote)
                          try:
                              attributes = sftp.lstat(remote)
                          except OSError as error:
                              if error.errno != errno.ENOENT:
                                  raise
                          else:
                              if not stat.S_ISREG(attributes.st_mode):
                                  raise SystemExit(f"Expected regular file: {path}")
                          temporary = f"{path.parent.as_posix()}/.codex-{os.environ['GITHUB_RUN_ID']}-{path.name}.tmp"
                          try:
                              sftp.put(str(path), temporary, confirm=True)
                              sftp.posix_rename(temporary, remote)
                          finally:
                              try:
                                  sftp.remove(temporary)
                              except FileNotFoundError:
                                  pass
                          print(f"Uploaded {remote}", flush=True)
                      with sftp.open("index.html", "rb") as entry:
                          if entry.read() != Path("index.html").read_bytes():
                              raise SystemExit("Remote index.html differs from source.")
                      verify_remote_files(sftp, selected_manifest(manifest, changed))
                      for remote in removed:
                          sftp.remove(remote)
                          print(f"Removed {remote}", flush=True)
                      print(f"DEV_TEST delta complete: {len(changed)} uploaded and verified; index.html verified.")

                  try:
                      attributes = sftp.lstat(".htaccess")
                  except OSError as error:
                      if error.errno != errno.ENOENT:
                          raise
                      original = None
                  else:
                      if not stat.S_ISREG(attributes.st_mode):
                          raise SystemExit("Existing .htaccess is not a regular file.")
                      with sftp.open(".htaccess", "rb") as entry:
                          original = entry.read()
                  if original is None:
                      raise SystemExit("DEV_TEST .htaccess missing; refusing to replace or guess password protection.")

                  url = "https://test1.automobile-rosenkranz.de/"
                  def anonymous_response():
                      try:
                          with urllib.request.urlopen(url, timeout=20) as response:
                              return response.status, response.headers
                      except urllib.error.HTTPError as error:
                          return error.code, error.headers

                  if anonymous_response()[0] != 401:
                      raise SystemExit("DEV_TEST password protection is not active; refusing .htaccess change.")
                  updated = merge(original)
                  if updated == original:
                      print("DEV_TEST hardening already current.")
                  else:
                      temporary = f".htaccess.codex-{os.environ['GITHUB_RUN_ID']}.tmp"
                      try:
                          with sftp.open(temporary, "wb") as entry:
                              entry.write(updated)
                          sftp.posix_rename(temporary, ".htaccess")
                      finally:
                          try:
                              sftp.remove(temporary)
                          except FileNotFoundError:
                              pass
                      try:
                          protected = anonymous_response()[0] == 401
                      except Exception:
                          protected = False
                      if not protected:
                          with sftp.open(temporary, "wb") as entry:
                              entry.write(original)
                          sftp.posix_rename(temporary, ".htaccess")
                          raise SystemExit("DEV_TEST security check failed; original .htaccess restored.")
                      print("DEV_TEST hardening installed; password protection still active.")
                  if os.environ["MODE"] in {"upload", "restamp"}:
                      marker = ".rosenkranz-release.json"
                      temporary = f"{marker}.{os.environ['GITHUB_RUN_ID']}.tmp"
                      try:
                          with sftp.open(temporary, "wb") as entry:
                              entry.write(manifest_bytes(manifest))
                          sftp.posix_rename(temporary, marker)
                      finally:
                          try:
                              sftp.remove(temporary)
                          except FileNotFoundError:
                              pass
                      with sftp.open(marker, "rb") as entry:
                          if entry.read() != manifest_bytes(manifest):
                              raise SystemExit("DEV_TEST release marker differs from source.")
                      print(f"DEV_TEST release marker: {manifest['sourceCommit']} / {manifest['contentDigest']}")
          PY

  webcheck:
    if: inputs.mode == 'webcheck'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/forms-client.test.cjs
      - name: Check protected DEV_TEST website
        env:
          DEV_TEST_USER: ${{ secrets.DEV_TEST_USER }}
          DEV_TEST_PASSWORD: ${{ secrets.DEV_TEST_PASSWORD }}
        run: node scripts/check-dev-test.cjs

  formscheck:
    if: inputs.mode == 'formscheck'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Send clearly marked DEV_TEST form inquiries
        env:
          DEV_TEST_USER: ${{ secrets.DEV_TEST_USER }}
          DEV_TEST_PASSWORD: ${{ secrets.DEV_TEST_PASSWORD }}
        run: node scripts/check-dev-forms.cjs
