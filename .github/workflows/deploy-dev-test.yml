name: Deploy Rosenkranz DEV_TEST
on:
  workflow_dispatch:
    inputs:
      mode:
        description: SFTP prüfen oder Website hochladen
        type: choice
        options: [check, upload]
        default: check
permissions:
  contents: read
concurrency:
  group: rosenkranz-dev-test
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install 'paramiko>=3.5,<5'
      - name: Verify destination or upload website
        env:
          MODE: ${{ inputs.mode }}
          SFTP_HOST: ${{ vars.IONOS_SFTP_HOST || secrets.IONOS_SFTP_HOST }}
          SFTP_PORT: ${{ vars.IONOS_SFTP_PORT || secrets.IONOS_SFTP_PORT || '22' }}
          SFTP_KNOWN_HOSTS: ${{ vars.IONOS_SFTP_KNOWN_HOSTS || secrets.IONOS_SFTP_KNOWN_HOSTS }}
          SFTP_USER: ${{ secrets.IONOS_DEV_SFTP_USERNAME || secrets.IONOS_PROD_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.IONOS_DEV_SFTP_PASSWORD || secrets.IONOS_PROD_SFTP_PASSWORD }}
        run: |
          python - <<'PY'
          import errno
          import os
          import stat
          import subprocess
          import tempfile
          from pathlib import Path, PurePosixPath

          import paramiko

          target = "/Web-Relaunch-2026/DEV_TEST"
          public_types = {
              ".html", ".css", ".js", ".mjs", ".png", ".jpg", ".jpeg",
              ".gif", ".webp", ".avif", ".svg", ".ico", ".woff", ".woff2",
              ".ttf", ".mp4", ".webm",
          }
          public_data = {"models.json", "inventory.json", "google-reviews.json", "robots.txt", "sitemap.xml"}
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          files = []
          for name in paths:
              path = Path(name)
              if not name or any(part.startswith(".") for part in path.parts):
                  continue
              if path.parts[0] in {"scripts", "docs", "tests", "deploy"}:
                  continue
              if path.is_file() and not path.is_symlink() and (
                  path.suffix.lower() in public_types or name in public_data
              ):
                  files.append(path)
          if Path("index.html") not in files:
              raise SystemExit("Website entry point missing from upload.")
          print(f"Target: {target}. Website files: {len(files)}", flush=True)
          for path in files:
              print(path.as_posix())

          for variable in ("SFTP_HOST", "SFTP_KNOWN_HOSTS", "SFTP_USER", "SFTP_PASSWORD"):
              if not os.environ[variable].strip():
                  raise SystemExit(f"Missing configuration: {variable}")

          with tempfile.NamedTemporaryFile(mode="w") as known_hosts, paramiko.SSHClient() as ssh:
              known_hosts.write(os.environ["SFTP_KNOWN_HOSTS"].rstrip() + "\n")
              known_hosts.flush()
              ssh.load_host_keys(known_hosts.name)
              ssh.set_missing_host_key_policy(paramiko.RejectPolicy())
              ssh.connect(
                  os.environ["SFTP_HOST"], port=int(os.environ["SFTP_PORT"]),
                  username=os.environ["SFTP_USER"], password=os.environ["SFTP_PASSWORD"],
                  allow_agent=False, look_for_keys=False,
                  timeout=15, banner_timeout=15, auth_timeout=15,
              )
              with ssh.open_sftp() as sftp:
                  sftp.get_channel().settimeout(30)
                  if not stat.S_ISDIR(sftp.lstat(target).st_mode) or sftp.normalize(target) != target:
                      raise SystemExit("DEV_TEST is not a direct directory at the configured path.")
                  print(f"Connected. DEV_TEST entries: {len(sftp.listdir(target))}", flush=True)
                  if os.environ["MODE"] == "check":
                      raise SystemExit(0)
                  if os.environ["MODE"] != "upload":
                      raise SystemExit("Unknown deployment mode.")

                  directories = sorted({parent.as_posix() for path in files for parent in path.parents} - {"."})
                  for directory in directories:
                      remote = str(PurePosixPath(target, directory))
                      try:
                          attributes = sftp.lstat(remote)
                      except OSError as error:
                          if error.errno != errno.ENOENT:
                              raise
                          sftp.mkdir(remote)
                          attributes = sftp.lstat(remote)
                      if not stat.S_ISDIR(attributes.st_mode):
                          raise SystemExit(f"Expected directory: {directory}")

                  for path in files:
                      remote = str(PurePosixPath(target, path.as_posix()))
                      try:
                          attributes = sftp.lstat(remote)
                      except OSError as error:
                          if error.errno != errno.ENOENT:
                              raise
                      else:
                          if not stat.S_ISREG(attributes.st_mode):
                              raise SystemExit(f"Expected regular file: {path}")
                      sftp.put(str(path), remote, confirm=True)
                      print(f"Uploaded {path}", flush=True)
                  with sftp.open(target + "/index.html", "rb") as entry:
                      if entry.read() != Path("index.html").read_bytes():
                          raise SystemExit("Remote index.html differs from source.")
                  print("DEV_TEST upload complete. index.html verified.")
          PY
