name: Send Rosenkranz live form test mails

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/forms-worker.test.mjs
      - name: Send five marked test inquiries to the dealership mailbox
        env:
          LIVE_MAIL_TEST: 'YES'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-live-test-mails.mjs
