name: Prepare Rosenkranz PROD promotion

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Vollständiger 40-stelliger Git-Commit des auf DEV_TEST abgenommenen Standes
        required: true
        type: string
      verify_all:
        description: Optionaler vollständiger SFTP-Hash-Audit aller Dateien (langsam)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rosenkranz-prod-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable approved commit is in main history
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full commit SHA required'; exit 1; }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
      - run: python -m pip install 'paramiko>=3.5,<5'
      - name: Verify approved DEV_TEST marker and critical files
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          FULL_REMOTE_VERIFY: ${{ inputs.verify_all && '1' || '0' }}
          SFTP_HOST: home273863182.1and1-data.host
          SFTP_PORT: '22'
          SFTP_KNOWN_HOSTS: ${{ vars.IONOS_SFTP_KNOWN_HOSTS || secrets.IONOS_SFTP_KNOWN_HOSTS }}
          SFTP_USER: u52165621
          SFTP_PASSWORD: ${{ secrets.IONOS_DEV_SFTP_PASSWORD }}
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/check_approved_release.py
      - name: Create deterministic production package
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/prepare-production-seo.py --output "$RUNNER_TEMP/rosenkranz-production"
          PYTHONDONTWRITEBYTECODE=1 python scripts/validate_production_release.py "$RUNNER_TEMP/rosenkranz-production"
      - uses: actions/upload-artifact@v4
        with:
          name: rosenkranz-production-${{ inputs.approved_sha }}
          path: ${{ runner.temp }}/rosenkranz-production/
          retention-days: 30
          if-no-files-found: error
