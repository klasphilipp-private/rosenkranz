name: Inspect Rosenkranz preview protection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install 'paramiko>=3.5,<5'
      - name: Read protection configuration without exposing credentials
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_KNOWN_HOSTS: ${{ vars.IONOS_SFTP_KNOWN_HOSTS || secrets.IONOS_SFTP_KNOWN_HOSTS }}
          IONOS_DEV_SFTP_PASSWORD: ${{ secrets.IONOS_DEV_SFTP_PASSWORD }}
          IONOS_PROD_SFTP_USERNAME: ${{ secrets.IONOS_PROD_SFTP_USERNAME }}
          IONOS_PROD_SFTP_PASSWORD: ${{ secrets.IONOS_PROD_SFTP_PASSWORD }}
          IONOS_PROD_REMOTE_PATH: ${{ secrets.IONOS_PROD_REMOTE_PATH }}
          PROD_PREVIEW_USER: ${{ secrets.PROD_PREVIEW_USER }}
          PROD_PREVIEW_PASSWORD: ${{ secrets.PROD_PREVIEW_PASSWORD }}
        run: |
          python - <<'PY'
          import os, tempfile
          import paramiko

          def inspect(user, password, directory):
              with tempfile.NamedTemporaryFile(mode='w') as known, paramiko.SSHClient() as ssh:
                  known.write(os.environ['IONOS_SFTP_KNOWN_HOSTS'].rstrip() + '\n')
                  known.flush()
                  ssh.load_host_keys(known.name)
                  ssh.set_missing_host_key_policy(paramiko.RejectPolicy())
                  ssh.connect(os.environ['IONOS_SFTP_HOST'], port=int(os.environ['IONOS_SFTP_PORT']),
                              username=user, password=password, allow_agent=False, look_for_keys=False,
                              timeout=15, banner_timeout=15, auth_timeout=15)
                  with ssh.open_sftp() as sftp:
                      sftp.chdir(directory)
                      entries = sftp.listdir('.')
                      try:
                          with sftp.open('.htaccess', 'rb') as file:
                              rules = file.read(20000)
                      except FileNotFoundError:
                          rules = b''
                      return len(entries), bool(rules), b'AuthType Basic' in rules, b'AuthUserFile ' in rules

          dev = inspect('u52165621', os.environ['IONOS_DEV_SFTP_PASSWORD'], '/Web-Relaunch-2026/DEV_TEST')
          prod = inspect(os.environ['IONOS_PROD_SFTP_USERNAME'], os.environ['IONOS_PROD_SFTP_PASSWORD'], os.environ['IONOS_PROD_REMOTE_PATH'])
          print(f'DEV_TEST: .htaccess present={dev[1]}, Basic Auth={dev[2]}, AuthUserFile={dev[3]}')
          print(f'PROD preview: directory entries={prod[0]}, .htaccess present={prod[1]}, Basic Auth={prod[2]}, AuthUserFile={prod[3]}')
          print(f'PROD preview GitHub auth secrets configured={bool(os.environ.get("PROD_PREVIEW_USER") and os.environ.get("PROD_PREVIEW_PASSWORD"))}')
          PY
