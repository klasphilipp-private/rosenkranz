name: Publish approved Rosenkranz PROD release

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Vollständiger DEV_TEST-Release-Commit (40 Zeichen)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rosenkranz-prod-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full commit SHA required'; exit 1; }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
      - run: python -m pip install 'paramiko>=3.5,<5'
      - name: Verify approved DEV_TEST marker and critical files
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          SFTP_HOST: home273863182.1and1-data.host
          SFTP_PORT: '22'
          SFTP_KNOWN_HOSTS: ${{ vars.IONOS_SFTP_KNOWN_HOSTS || secrets.IONOS_SFTP_KNOWN_HOSTS }}
          SFTP_USER: u52165621
          SFTP_PASSWORD: ${{ secrets.IONOS_DEV_SFTP_PASSWORD }}
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/check_approved_release.py
      - name: Build and validate indexable production package
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/prepare-production-seo.py --output "$RUNNER_TEMP/rosenkranz-production"
          PYTHONDONTWRITEBYTECODE=1 python scripts/validate_production_release.py "$RUNNER_TEMP/rosenkranz-production"
      - name: Stage, verify and atomically publish to public PROD preview
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          PROD_BUILD_DIR: ${{ runner.temp }}/rosenkranz-production
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_KNOWN_HOSTS: ${{ vars.IONOS_SFTP_KNOWN_HOSTS || secrets.IONOS_SFTP_KNOWN_HOSTS }}
          IONOS_PROD_SFTP_USERNAME: ${{ secrets.IONOS_PROD_SFTP_USERNAME }}
          IONOS_PROD_SFTP_PASSWORD: ${{ secrets.IONOS_PROD_SFTP_PASSWORD }}
          IONOS_PROD_REMOTE_PATH: ${{ secrets.IONOS_PROD_REMOTE_PATH }}
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/deploy_prod_preview.py
