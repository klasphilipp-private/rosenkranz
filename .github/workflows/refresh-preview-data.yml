name: Refresh Rosenkranz preview data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-mobile-inventory.py'
      - 'scripts/sync-google-reviews.py'
      - '.github/workflows/refresh-preview-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: refresh-preview-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh mobile.de inventory
        env:
          MOBILE_API_USERNAME: ${{ secrets.MOBILE_API_USERNAME }}
          MOBILE_API_PASSWORD: ${{ secrets.MOBILE_API_PASSWORD }}
        run: |
          if [ -z "$MOBILE_API_USERNAME" ] || [ -z "$MOBILE_API_PASSWORD" ]; then
            echo '::warning::mobile.de sync skipped; add MOBILE_API_USERNAME and MOBILE_API_PASSWORD under Settings > Secrets and variables > Actions.'
          else
            python3 scripts/sync-mobile-inventory.py
          fi
      - name: Refresh Google Places reviews
        id: google_reviews
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
            python3 scripts/sync-google-reviews.py
          else
            echo 'Google reviews kept at the latest checked-in snapshot; add GOOGLE_PLACES_API_KEY to Actions secrets to refresh them.'
          fi
      - name: Report Google review refresh failure
        if: steps.google_reviews.outcome == 'failure'
        run: echo '::warning::Google reviews were not refreshed; the previous snapshot was kept. See the Places API response above.'
      - name: Commit changed snapshots
        id: snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- inventory.json google-reviews.json angebote sitemap.xml
          if git diff --cached --quiet; then
            echo 'Preview data is unchanged'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Refresh Rosenkranz preview data'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish changed API data to IONOS DEV_TEST and PROD
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.sha }}
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_KNOWN_HOSTS: ${{ vars.IONOS_SFTP_KNOWN_HOSTS || secrets.IONOS_SFTP_KNOWN_HOSTS }}
          IONOS_DEV_SFTP_USERNAME: u52165621
          IONOS_DEV_SFTP_PASSWORD: ${{ secrets.IONOS_DEV_SFTP_PASSWORD }}
          IONOS_PROD_SFTP_USERNAME: ${{ secrets.IONOS_PROD_SFTP_USERNAME }}
          IONOS_PROD_SFTP_PASSWORD: ${{ secrets.IONOS_PROD_SFTP_PASSWORD }}
          IONOS_PROD_REMOTE_PATH: ${{ secrets.IONOS_PROD_REMOTE_PATH }}
        run: |
          python -m pip install 'paramiko>=3.5,<5'
          python3 scripts/promote_refreshed_data.py
