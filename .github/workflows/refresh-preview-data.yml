name: Refresh Rosenkranz preview data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-mobile-inventory.py'
      - 'scripts/sync-google-reviews.py'
      - '.github/workflows/refresh-preview-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

# Serialize refreshes so parallel runs cannot race while committing snapshots.
concurrency:
  group: refresh-preview-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh mobile.de inventory
        env:
          MOBILE_API_USERNAME: ${{ secrets.MOBILE_API_USERNAME }}
          MOBILE_API_PASSWORD: ${{ secrets.MOBILE_API_PASSWORD }}
        run: |
          if [ -z "$MOBILE_API_USERNAME" ] || [ -z "$MOBILE_API_PASSWORD" ]; then
            echo '::warning::mobile.de sync skipped; add MOBILE_API_USERNAME and MOBILE_API_PASSWORD under Settings > Secrets and variables > Actions.'
          else
            python3 scripts/sync-mobile-inventory.py
          fi
      - name: Refresh Google Places reviews
        id: google_reviews
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
            python3 scripts/sync-google-reviews.py
          else
            echo 'Google reviews kept at the latest checked-in snapshot; add GOOGLE_PLACES_API_KEY to Actions secrets to refresh them.'
          fi
      - name: Report Google review refresh failure
        if: steps.google_reviews.outcome == 'failure'
        run: echo '::warning::Google reviews were not refreshed; the previous snapshot was kept. See the Places API response above.'
      - name: Commit changed snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Preview data is unchanged'
            exit 0
          fi
          git commit -m 'Refresh Rosenkranz preview data'
          git pull --rebase origin main
          git push
