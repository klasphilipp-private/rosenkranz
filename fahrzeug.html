<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Fahrzeugangebot | Automobile Rosenkranz</title><meta name="description" content="Details und Bilder zu einem Fahrzeugangebot von Automobile Rosenkranz in Recklinghausen."><link rel="stylesheet" href="styles.css?v=20261023"><link rel="icon" href="assets/fi_1-1.png"></head>
<body>

<main><section class="vehicle-detail"><div class="wrap"><a class="vehicle-back" href="angebote.html">← Zur Angebotsübersicht</a><div id="vehicle-content" aria-live="polite"><p>Fahrzeugangebot wird geladen …</p></div></div></section></main><div id="shared-footer"></div>
<script src="consent.js?v=20261023"></script><script src="site-shell.js?v=20261019-1"></script><script src="footer.js?v=20261019-1"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search),requested=params.get('id')||params.get('title');
fetch('inventory.json?v=20261023-api').then(r=>r.ok?r.json():Promise.reject()).then(data=>{
 const car=(data.vehicles||[]).find(v=>String(v.id||'')===requested||v.title===requested);
 if(!car)throw new Error('Angebot nicht gefunden');
 document.title=`${car.title} | Automobile Rosenkranz`;
 const pics=(car.images?.length?car.images:[car.image]).filter(Boolean);
 const specs=car.details?.length?car.details:[['Fahrzeugart',car.vehicleClass],['Kraftstoff',car.fuel],['Getriebe',car.gearbox],['Antrieb',car.driveType],['Erstzulassung',car.firstRegistration],['Kilometerstand',car.mileage?`${Number(car.mileage).toLocaleString('de-DE')} km`:null],['Leistung',car.power?`${car.power} kW`:null]].filter(x=>x[1]).map(x=>({label:x[0],value:x[1]}));
 document.querySelector('#vehicle-content').innerHTML=`<div class="vehicle-detail-layout"><div><div class="vehicle-gallery"><div class="vehicle-gallery-track" aria-label="Fahrzeugbilder">${pics.map((url,i)=>`<figure class="vehicle-gallery-slide"><span class="media-consent-placeholder">Fahrzeugfoto nach Freigabe externer Medien</span><img data-external-src="${esc(url)}" alt="${esc(car.title)} – Bild ${i+1}" loading="lazy"></figure>`).join('')}</div><div class="vehicle-gallery-controls"><button type="button" class="vehicle-gallery-prev" aria-label="Vorheriges Bild">←</button><span class="vehicle-gallery-count">1 / ${pics.length}</span><button type="button" class="vehicle-gallery-next" aria-label="Nächstes Bild">→</button></div></div><p class="vehicle-gallery-hint">Bilder nach rechts oder links wischen</p></div><div class="vehicle-summary"><span class="eyebrow">${esc(car.make||'Automobile Rosenkranz')} · Fahrzeugangebot</span><h1>${esc(car.title)}</h1><p class="vehicle-price">${esc(car.price||'Preis auf Anfrage')}</p><p class="vehicle-location">Automobile Rosenkranz · Recklinghausen</p><a class="btn btn-red" href="index.html#kontakt">Beratung zu diesem Fahrzeug anfragen</a><a class="vehicle-phone" href="tel:+49236191490">Oder direkt anrufen: 02361 / 9149-0</a></div></div><section class="vehicle-facts"><h2>Fahrzeugdetails</h2><dl>${specs.map(x=>`<div><dt>${esc(x.label)}</dt><dd>${esc(x.value)}</dd></div>`).join('')}</dl></section>${car.description?`<section class="vehicle-description"><h2>Beschreibung</h2><p>${esc(car.description)}</p></section>`:''}<p class="notice">Angaben ohne Gewähr. Verfügbarkeit, Ausstattung und Preis können sich ändern. Bitte lassen Sie sich die Details von unserem Verkaufsteam bestätigen.</p>`;
 const track=document.querySelector('.vehicle-gallery-track'),slides=[...document.querySelectorAll('.vehicle-gallery-slide')],count=document.querySelector('.vehicle-gallery-count');let pos=0;const go=n=>{pos=(n+slides.length)%slides.length;track.scrollTo({left:pos*track.clientWidth,behavior:'smooth'});count.textContent=`${pos+1} / ${slides.length}`};document.querySelector('.vehicle-gallery-prev').onclick=()=>go(pos-1);document.querySelector('.vehicle-gallery-next').onclick=()=>go(pos+1);track.addEventListener('scroll',()=>{pos=Math.round(track.scrollLeft/track.clientWidth);count.textContent=`${pos+1} / ${slides.length}`},{passive:true});if(window.RosenkranzConsent?.hasExternalMedia())window.RosenkranzConsent.hydrateExternalMedia();
}).catch(()=>{document.querySelector('#vehicle-content').innerHTML='<h1>Fahrzeugangebot nicht verfügbar</h1><p>Dieses Fahrzeug ist nicht mehr in der aktuellen Auswahl. <a href="angebote.html">Zur Angebotsübersicht</a></p>'});
</script></body></html>
